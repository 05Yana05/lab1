name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    name: Сборка и проверка Node.js сервера
    runs-on: ubuntu-latest

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Установить зависимости
        working-directory: ./server
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Запустить сервер и проверить ответ
        working-directory: ./server
        run: |
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          echo "PID сервера: $SERVER_PID"

          # Ждём до 30 секунд, пока сервер начнёт отвечать
          ready=0
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/users > /dev/null; then
              echo "Сервер готов (попытка $i)"
              ready=1
              break
            fi
            # Если процесс уже умер — нет смысла ждать
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Процесс сервера завершился преждевременно"
              break
            fi
            sleep 1
          done

          echo "----- ЛОГ СЕРВЕРА -----"
          cat server.log
          echo "-----------------------"

          if [ "$ready" -ne 1 ]; then
            echo "Сервер не поднялся"
            exit 1
          fi

          curl -f http://127.0.0.1:3000/users

          kill $SERVER_PID || true